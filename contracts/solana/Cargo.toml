[workspace]
members = ["programs/*"]
resolver = "2"

# Solana rent is a pure function of allocated bytes, so program size IS the
# deployment cost: (len + 45 + 128) * 3480 * 2 lamports. Shrinking the binary is
# the only lever that reduces it, and these four lines cut 245,496 B -> 207,488 B
# (15.5%, ~0.26 SOL) without touching a line of program logic.
#
# overflow-checks STAYS ON. Turning it off saves a further 6,544 B — about $3 —
# on a contract that does arithmetic on token amounts and tile ids. That is not a
# trade worth making, and it is recorded here so nobody re-derives it as a "win".
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
