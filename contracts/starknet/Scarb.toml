[package]
name = "cryptoland"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.11.4"
openzeppelin_token = "1.0.0"
openzeppelin_introspection = "1.0.0"
openzeppelin_access = "1.0.0"

# Required for #[test] — without it scarb rejects the attribute outright.
[dev-dependencies]
cairo_test = "2.11.4"

[[target.starknet-contract]]
sierra = true
# Declaring a class on Starknet requires BOTH the Sierra program and its CASM
# compilation — the sequencer verifies one against the other. `sierra = true`
# alone builds and unit-tests perfectly while producing an artifact that cannot
# be declared, which is the same shape of gap MultiversX had (no wasm subcrate).
casm = true
