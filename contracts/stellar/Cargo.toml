[package]
name = "cryptoland-tile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22"

# testutils pulls soroban-env-host, which fails to compile its own ed25519_dalek
# dependency under rustc 1.97. Nothing in src/ uses it — the invariant tests are
# pure arithmetic — so dropping it makes the suite runnable without touching the
# SDK version that the wasm build needs.

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
