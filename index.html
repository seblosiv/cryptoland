<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Telegram Mini App SDK. Telegram's docs require this to load in <head>
         BEFORE any other script. It is injected by the Telegram client, so
         window.Telegram is simply undefined in a normal browser and every use
         in src/lib/telegram.js is feature-gated. See documentation/grants.md §5. -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <!-- SVG first for modern browsers; the PNGs are what Google's crawler
         indexes (it wants a square multiple of 48 from a <link rel="icon">),
         and the .ico is the fallback for old ones. Emitted per chain by
         scripts/chain-icons.mjs, tinted with that chain's accent. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#08080c" />
    <meta name="description" content="Own real Earth territory on the blockchain. Buy map tiles with crypto." />
    <title>CryptoLand by XONO — Own the World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <!-- MapLibre GL CSS is bundled via src/main.jsx -->
    <meta property="og:title" content="CRYPTOLAND — Own the World" />
    <meta property="og:description" content="Own real Earth territory on the blockchain. Buy map tiles with crypto." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="CryptoLand" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
